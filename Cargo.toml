[workspace]
resolver = "2"
members = [
  "crates/model",
  "crates/storage",
  "crates/tls",
  "crates/proxy-http",
  "crates/rules",
  "crates/engine",
  "crates/api",
  "crates/mcp",
  "crates/ffi",
  "apps/cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.80"
repository = "https://github.com/OWNER/flowmint"

[workspace.dependencies]
# shared foundation
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v7", "serde"] }
sha2 = "0.10"
hex = "0.4"
thiserror = "2"
anyhow = "1"

# async runtime + net
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros", "sync", "time", "signal"] }

# observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# storage
rusqlite = { version = "0.32", features = ["bundled"] }

# cli
clap = { version = "4", features = ["derive"] }

# redaction
regex = "1"

# 响应体解压（Content-Encoding: gzip/deflate/br/zstd）
flate2 = "1"
brotli = "7"
zstd = "0.13"

# tls / mitm
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem", "x509-parser"] }
time = { version = "0.3", default-features = false, features = ["std"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
webpki-roots = "0.26"

# internal crates
flowmint-model = { path = "crates/model" }
flowmint-storage = { path = "crates/storage" }
flowmint-tls = { path = "crates/tls" }
flowmint-proxy-http = { path = "crates/proxy-http" }
flowmint-rules = { path = "crates/rules" }
flowmint-engine = { path = "crates/engine" }
flowmint-api = { path = "crates/api" }
flowmint-mcp = { path = "crates/mcp" }

[profile.release]
lto = "thin"
